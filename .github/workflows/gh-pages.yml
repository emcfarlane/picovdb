name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task build:demo
      - name: Stage site
        run: |
          mkdir -p _stage/demo
          cp README.md bunny.png _stage/
          cp demo/index.html demo/index.js _stage/demo/
      - name: Download models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _stage/demo/models
          gh release download 0.0.1 --pattern '*.pvdb.gz' --dir _stage/demo/models
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_stage
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
